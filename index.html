<!doctype html>
<html lang="pt-BR" data-theme="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1012">
  <meta name="description" content="Minhas raquetes, cordas e setups de tênis.">
  <title>Meu Setup</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Aplica o tema antes de desenhar, para não piscar.
    try {
      var tema = localStorage.getItem('ar.tema');
      if (tema) document.documentElement.dataset.theme = tema;
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="tela"></main>
  <nav id="nav" class="nav" aria-label="Navegação principal"></nav>
  <div id="camada" hidden></div>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
  <noscript>Este aplicativo precisa de JavaScript ativado.</noscript>
</body>
</html>
